<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HeatGuard 360 - Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>🌡️ Smart Heat Alert</h1>

        <p class="subtitle">
            Stay safe from extreme heat
        </p>

        {% if not config.DEMO_OTP_ENABLED %}
            <p class="error">
                Local demo OTP is disabled. Set APP_ENV=local and enable
                DEMO_OTP_ENABLED to test sign-in.
            </p>
        {% endif %}

        <form method="POST">

            <label>Mobile Number</label>

            <input
                type="tel"
                name="mobile_number"
                placeholder="Enter your mobile number"
                maxlength="10"
                required
            >

            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

            <button type="submit">
                Send OTP
            </button>

        </form>

    </div>

</div>

</body>
</html>
